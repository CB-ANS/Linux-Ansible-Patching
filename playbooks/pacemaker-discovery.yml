---
- name: Discover Pacemaker cluster topology
  hosts: all
  gather_facts: false
  become: true

  vars:
    # Keep false while testing.
    # Set to true later if an unhealthy cluster should stop the AWX workflow.
    cluster_discovery_fail_on_unhealthy: false

  tasks:
    - name: Select cluster discovery node
      ansible.builtin.set_fact:
        cluster_discovery_node: "{{ ansible_play_hosts_all | first }}"
      run_once: true

    - name: Gather Pacemaker cluster status
      ansible.builtin.command:
        cmd: pcs status --full
      register: pcs_status
      changed_when: false
      run_once: true
      delegate_to: "{{ cluster_discovery_node }}"

    - name: Display raw Pacemaker status
      ansible.builtin.debug:
        var: pcs_status.stdout_lines
      run_once: true
      when: cluster_discovery_debug | default(false) | bool

    - name: Parse Pacemaker cluster status
      ansible.builtin.shell:
        cmd: |
          python3 - "{{ pcs_status.stdout | b64encode }}" <<'PYTHON'
          import base64
          import json
          import re
          import sys

          status = base64.b64decode(sys.argv[1]).decode(
              "utf-8",
              errors="replace"
          )

          result = {
              "cluster_name": None,
              "current_dc": None,
              "quorum": False,
              "configured_node_count": 0,
              "configured_resource_count": 0,
              "online_nodes": [],
              "offline_nodes": [],
              "standby_nodes": [],
              "workload_resources": [],
              "ignored_resources": [],
              "resource_groups": {},
              "service_distribution": {},
              "workload_nodes": [],
              "active_node": None,
              "passive_nodes": [],
              "cluster_type": "unknown",
              "failed_actions": False,
              "healthy": False,
              "reasons": [],
          }

          def clean_node_list(node_text):
              """
              Convert:
                  PEN-DB-01 (1) PEN-DB-02 (2)

              Into:
                  ["PEN-DB-01", "PEN-DB-02"]
              """
              node_text = re.sub(
                  r"\s+\(\d+\)",
                  "",
                  node_text
              )

              return [
                  node.strip()
                  for node in node_text.split()
                  if node.strip()
              ]

          def parse_bracketed_nodes(label):
              pattern = (
                  rf"^\s*\*\s*{label}:\s*"
                  rf"\[\s*([^\]]*)\]"
              )

              match = re.search(
                  pattern,
                  status,
                  re.MULTILINE | re.IGNORECASE
              )

              if not match:
                  return []

              return clean_node_list(match.group(1))

          # Cluster name
          match = re.search(
              r"^Cluster name:\s*(\S+)",
              status,
              re.MULTILINE
          )

          if match:
              result["cluster_name"] = match.group(1)

          # Current designated controller
          match = re.search(
              r"Current DC:\s*(\S+)",
              status
          )

          if match:
              result["current_dc"] = match.group(1)

          # Quorum
          result["quorum"] = (
              "partition with quorum" in status.lower()
          )

          # Configured node count
          match = re.search(
              r"\*\s*(\d+)\s+nodes?\s+configured",
              status,
              re.IGNORECASE
          )

          if match:
              result["configured_node_count"] = int(
                  match.group(1)
              )

          # Configured resource instance count
          match = re.search(
              r"\*\s*(\d+)\s+resource instances?\s+configured",
              status,
              re.IGNORECASE
          )

          if match:
              result["configured_resource_count"] = int(
                  match.group(1)
              )

          # Node states
          result["online_nodes"] = parse_bracketed_nodes(
              "Online"
          )

          result["offline_nodes"] = parse_bracketed_nodes(
              "OFFLINE"
          )

          # Standby nodes can appear in different formats.
          standby_patterns = [
              r"^\s*\*\s*Node\s+(\S+):\s*standby",
              r"^\s*\*\s*(\S+):\s*standby",
          ]

          for pattern in standby_patterns:
              for match in re.finditer(
                  pattern,
                  status,
                  re.MULTILINE | re.IGNORECASE
              ):
                  node = match.group(1)

                  if node not in result["standby_nodes"]:
                      result["standby_nodes"].append(node)

          # Detect failed resource actions.
          result["failed_actions"] = bool(
              re.search(
                  r"^Failed Resource Actions:",
                  status,
                  re.MULTILINE | re.IGNORECASE
              )
          )

          current_group = None
          current_clone = None

          group_pattern = re.compile(
              r"^\s*\*\s*Resource Group:\s*(\S+):\s*$",
              re.IGNORECASE
          )

          clone_pattern = re.compile(
              r"^\s*\*\s*(?:Promotable\s+)?Clone Set:"
              r"\s*(\S+)\s+\[([^\]]+)\]:",
              re.IGNORECASE
          )

          # Examples:
          #
          # * r_mysql (ocf:heartbeat:mysql): Started PEN-DB-02
          # * ecloud_stonith (stonith:fence_ecloud): Started PEN-DB-01
          resource_pattern = re.compile(
              r"^\s*\*\s+(\S+)\s+"
              r"\(([^)]+)\):\s+"
              r"(Started|Promoted|Unpromoted|Stopped|FAILED)"
              r"(?:\s+(\S+))?\s*$",
              re.IGNORECASE
          )

          # Example:
          #
          # * Started: [ PEN-DB-01 (1) PEN-DB-02 (2) ]
          clone_state_pattern = re.compile(
              r"^\s*\*\s+"
              r"(Started|Promoted|Unpromoted|Stopped|FAILED):"
              r"\s*\[\s*([^\]]*)\]",
              re.IGNORECASE
          )

          ignored_agent_prefixes = (
              "stonith:",
              "ocf:pacemaker:ping",
              "ocf:pacemaker:remote",
          )

          ignored_resource_name_patterns = (
              "stonith",
              "fence",
              "ping",
          )

          def should_ignore_resource(
              resource_id,
              agent,
              clone_name=None
          ):
              resource_name_lower = resource_id.lower()
              agent_lower = agent.lower()
              clone_name_lower = (
                  clone_name.lower()
                  if clone_name
                  else ""
              )

              if agent_lower.startswith(
                  ignored_agent_prefixes
              ):
                  return True

              if any(
                  pattern in resource_name_lower
                  for pattern in ignored_resource_name_patterns
              ):
                  return True

              if any(
                  pattern in clone_name_lower
                  for pattern in ignored_resource_name_patterns
              ):
                  return True

              return False

          for raw_line in status.splitlines():
              line = raw_line.rstrip()

              group_match = group_pattern.match(line)

              if group_match:
                  current_group = group_match.group(1)
                  current_clone = None

                  result["resource_groups"].setdefault(
                      current_group,
                      {
                          "resources": [],
                          "nodes": [],
                          "owner": None,
                      }
                  )

                  continue

              clone_match = clone_pattern.match(line)

              if clone_match:
                  current_clone = clone_match.group(1)
                  current_group = None
                  continue

              clone_state_match = clone_state_pattern.match(
                  line
              )

              if clone_state_match and current_clone:
                  clone_state = clone_state_match.group(1)
                  clone_nodes = clean_node_list(
                      clone_state_match.group(2)
                  )

                  for node in clone_nodes:
                      resource = {
                          "id": current_clone,
                          "agent": "clone",
                          "state": clone_state,
                          "node": node,
                          "group": None,
                          "clone": current_clone,
                      }

                      # Clones are recorded for visibility but do not
                      # determine active/passive workload placement.
                      result["ignored_resources"].append(resource)

                  continue

              if (
                  line.startswith("Node List:")
                  or line.startswith("Daemon Status:")
                  or line.startswith("Failed Resource Actions:")
              ):
                  current_group = None
                  current_clone = None
                  continue

              resource_match = resource_pattern.match(line)

              if not resource_match:
                  continue

              resource_id, agent, state, node = (
                  resource_match.groups()
              )

              resource = {
                  "id": resource_id,
                  "agent": agent,
                  "state": state,
                  "node": node,
                  "group": current_group,
                  "clone": current_clone,
              }

              is_ignored = should_ignore_resource(
                  resource_id,
                  agent,
                  current_clone
              )

              if is_ignored:
                  result["ignored_resources"].append(resource)
                  continue

              result["workload_resources"].append(resource)

              # Only actively running workload resources count.
              if state.lower() not in (
                  "started",
                  "promoted"
              ):
                  continue

              if not node:
                  continue

              result["service_distribution"].setdefault(
                  node,
                  0
              )

              result["service_distribution"][node] += 1

              if current_group:
                  group = result["resource_groups"][
                      current_group
                  ]

                  if resource_id not in group["resources"]:
                      group["resources"].append(resource_id)

                  if node not in group["nodes"]:
                      group["nodes"].append(node)

          # Include online nodes with no active workload resources.
          for node in result["online_nodes"]:
              result["service_distribution"].setdefault(
                  node,
                  0
              )

          # Determine ownership of each resource group.
          for group in result["resource_groups"].values():
              if len(group["nodes"]) == 1:
                  group["owner"] = group["nodes"][0]

              elif len(group["nodes"]) > 1:
                  group["owner"] = "multiple"

          # Nodes running one or more workload resources.
          result["workload_nodes"] = sorted(
              node
              for node, count
              in result["service_distribution"].items()
              if count > 0
          )

          # Online nodes running no workload resources.
          result["passive_nodes"] = [
              node
              for node in result["online_nodes"]
              if result["service_distribution"].get(
                  node,
                  0
              ) == 0
          ]

          # Cluster classification.
          if len(result["workload_nodes"]) == 1:
              result["cluster_type"] = "active_passive"
              result["active_node"] = (
                  result["workload_nodes"][0]
              )

          elif len(result["workload_nodes"]) > 1:
              result["cluster_type"] = "active_active"

          elif len(result["workload_nodes"]) == 0:
              result["cluster_type"] = (
                  "no_active_workloads"
              )

          # Health checks.
          if not result["cluster_name"]:
              result["reasons"].append(
                  "Cluster name could not be detected"
              )

          if not result["current_dc"]:
              result["reasons"].append(
                  "Current cluster DC could not be detected"
              )

          if not result["quorum"]:
              result["reasons"].append(
                  "Cluster does not have quorum"
              )

          if not result["online_nodes"]:
              result["reasons"].append(
                  "No online cluster nodes were detected"
              )

          if result["offline_nodes"]:
              result["reasons"].append(
                  "Offline nodes: "
                  + ", ".join(result["offline_nodes"])
              )

          if result["standby_nodes"]:
              result["reasons"].append(
                  "Nodes already in standby: "
                  + ", ".join(result["standby_nodes"])
              )

          if result["failed_actions"]:
              result["reasons"].append(
                  "Pacemaker reports failed resource actions"
              )

          if (
              result["configured_node_count"] > 0
              and len(result["online_nodes"])
              != result["configured_node_count"]
          ):
              result["reasons"].append(
                  "Not all configured cluster nodes are online"
              )

          if result["cluster_type"] == "no_active_workloads":
              result["reasons"].append(
                  "No active service workload resources were detected"
              )

          if result["cluster_type"] == "unknown":
              result["reasons"].append(
                  "Unable to determine cluster workload placement"
              )

          result["healthy"] = (
              len(result["reasons"]) == 0
          )

          print(json.dumps(result))
          PYTHON
      args:
        executable: /bin/bash
      register: parsed_cluster
      changed_when: false
      run_once: true
      delegate_to: "{{ cluster_discovery_node }}"

    - name: Store cluster discovery result
      ansible.builtin.set_fact:
        cluster_discovery: >-
          {{
            parsed_cluster.stdout
            | trim
            | from_json
          }}
      run_once: true

    - name: Display cluster discovery summary
      ansible.builtin.debug:
        msg:
          - >-
            Cluster:
            {{ cluster_discovery.cluster_name | default('Unknown', true) }}
          - >-
            Current DC:
            {{ cluster_discovery.current_dc | default('Unknown', true) }}
          - >-
            Type:
            {{ cluster_discovery.cluster_type }}
          - >-
            Healthy:
            {{ cluster_discovery.healthy }}
          - >-
            Online nodes:
            {{
              cluster_discovery.online_nodes
              | join(', ')
              if cluster_discovery.online_nodes | length > 0
              else 'None'
            }}
          - >-
            Active node:
            {{
              cluster_discovery.active_node
              | default('N/A', true)
            }}
          - >-
            Passive nodes:
            {{
              cluster_discovery.passive_nodes
              | join(', ')
              if cluster_discovery.passive_nodes | length > 0
              else 'None'
            }}
          - >-
            Workload nodes:
            {{
              cluster_discovery.workload_nodes
              | join(', ')
              if cluster_discovery.workload_nodes | length > 0
              else 'None'
            }}
          - >-
            Workload distribution:
            {{ cluster_discovery.service_distribution }}
          - >-
            Resource groups:
            {{ cluster_discovery.resource_groups }}
          - >-
            Ignored resources:
            {{
              cluster_discovery.ignored_resources
              | map(attribute='id')
              | list
            }}
          - >-
            Health reasons:
            {{
              cluster_discovery.reasons
              | join('; ')
              if cluster_discovery.reasons | length > 0
              else 'None'
            }}
      run_once: true

    - name: Publish discovery information to AWX workflow
      ansible.builtin.set_stats:
        data:
          cluster_name: "{{ cluster_discovery.cluster_name }}"
          cluster_current_dc: "{{ cluster_discovery.current_dc }}"
          cluster_type: "{{ cluster_discovery.cluster_type }}"
          cluster_healthy: "{{ cluster_discovery.healthy }}"
          cluster_active_node: "{{ cluster_discovery.active_node }}"
          cluster_passive_nodes: "{{ cluster_discovery.passive_nodes }}"
          cluster_online_nodes: "{{ cluster_discovery.online_nodes }}"
          cluster_workload_nodes: "{{ cluster_discovery.workload_nodes }}"
          cluster_service_distribution: >-
            {{ cluster_discovery.service_distribution }}
          cluster_resource_groups: >-
            {{ cluster_discovery.resource_groups }}
          cluster_discovery: "{{ cluster_discovery }}"
        per_host: false
      run_once: true

    - name: Stop workflow when cluster is unhealthy
      ansible.builtin.assert:
        that:
          - cluster_discovery.healthy | bool
        fail_msg: >-
          Cluster discovery failed its health checks:
          {{ cluster_discovery.reasons | join('; ') }}
        success_msg: >-
          Cluster {{ cluster_discovery.cluster_name }}
          passed discovery health checks and was classified as
          {{ cluster_discovery.cluster_type }}.
      when:
        - cluster_discovery_fail_on_unhealthy | bool
      run_once: true