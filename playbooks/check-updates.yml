---
- name: Check available patches and reboot requirement
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Check available updates on Debian/Ubuntu
      ansible.builtin.shell: |
        apt-get update -qq
        apt list --upgradable 2>/dev/null | tail -n +2
      register: apt_updates
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Check available updates on RHEL/Alma/Rocky
      ansible.builtin.shell: |
        dnf check-update || test $? -eq 100
      register: dnf_updates
      changed_when: false
      failed_when: false
      when: ansible_facts['os_family'] == "RedHat"

    - name: Check if reboot is required on Debian/Ubuntu
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: debian_reboot_required
      when: ansible_facts['os_family'] == "Debian"

    - name: Check if reboot is required on RHEL/Alma/Rocky
      ansible.builtin.command: needs-restarting -r
      register: rhel_reboot_required
      changed_when: false
      failed_when: false
      when: ansible_facts['os_family'] == "RedHat"

    - name: Detect kernel updates on Debian/Ubuntu
      ansible.builtin.set_fact:
        kernel_update_available: "{{ apt_updates.stdout is search('linux-image|linux-headers|linux-modules') }}"
      when: ansible_facts['os_family'] == "Debian"

    - name: Detect kernel updates on RHEL/Alma/Rocky
      ansible.builtin.set_fact:
        kernel_update_available: "{{ dnf_updates.stdout is search('kernel|kernel-core|kernel-modules') }}"
      when: ansible_facts['os_family'] == "RedHat"

    - name: Set reboot required fact
      ansible.builtin.set_fact:
        reboot_required: >-
          {{
            (ansible_facts['os_family'] == "Debian" and debian_reboot_required.stat.exists | default(false))
            or
            (ansible_facts['os_family'] == "RedHat" and rhel_reboot_required.rc | default(0) == 1)
          }}

    - name: Build readable patch summary
      ansible.builtin.set_fact:
        patch_summary: |
          Host: {{ inventory_hostname }}
          OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          Kernel: {{ ansible_facts['kernel'] }}
          Kernel update available: {{ kernel_update_available | default(false) }}
          Reboot required: {{ reboot_required }}
          Available updates:
          {% for update in apt_updates.stdout_lines | default(dnf_updates.stdout_lines | default([])) %}
          - {{ update }}
          {% endfor %}

    - name: Send patch summary to Teams
      ansible.builtin.uri:
        url: "{{ lookup('env', 'teams_webhook_url') }}"
        method: POST
        body_format: json
        body:
          text: "{{ patch_summary }}"
        status_code: 202
      delegate_to: localhost
      become: false
      when: lookup('env', 'teams_webhook_url') | length > 0